spring.application.name=api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}

spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/shl}
spring.datasource.username=${DB_USER:pguser}
spring.datasource.password=${DB_PASSWORD:example}

spring.jpa.hibernate.ddl-auto=update

springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

app.api-key=${API-KEY:dev-secret-key-of-doom123!}