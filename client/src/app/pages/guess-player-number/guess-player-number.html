<main class="main">
  <h1 class="mb1 title">Gissa numret!</h1>
  <div class="content">
    <app-player-card [game]="GameType.GUESS_NUMBER"></app-player-card>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form flex col">
    <mat-form-field>
      <mat-label>Nummer</mat-label>
      <input matInput fullWidth placeholder="Ange nummer" formControlName="number" />
      @if (form.controls.number.touched && form.controls.number.hasError('pattern')) {
        <mat-error> Ange nummer mellan 1-99 </mat-error>
      }
    </mat-form-field>
    <app-loadingbutton [isLoading]="loading()"></app-loadingbutton>
  </form>
  <div>
    <p>Antal rätt: {{ correctCounter() }}</p>
  </div>
</main>
