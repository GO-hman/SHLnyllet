<main class="main">
  <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-evenly">
    <mat-form-field>
      <mat-label>Välj ett lag</mat-label>
      <mat-select [(value)]="selectedTeam" (selectionChange)="onTeamChange($event.value)">
        <mat-option [value]="null">Alla lag</mat-option>
        @for (team of allTeams(); track team.uuid) {
          <mat-option [value]="team">{{ team.teamCode }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <button matButton="outlined" (click)="onNewPlayer()">Ny spelare</button>
  </div>
  <div class="content">
    <div class="player-frame">
      @if (loading() || (currPlayer() != null && !imageLoaded())) {
        <mat-spinner></mat-spinner>
      }
      @if (currPlayer(); as player) {
        <img
          class="player-picture"
          [class.loaded]="imageLoaded()"
          [src]="currPlayer()?.imgUrl"
          alt="Bild på spelare"
          (load)="onImageLoad()"
        />
      }
    </div>
    @if (currPlayer()?.name != null) {
      <p class="player-name">{{ currPlayer()?.name }}</p>
    }
  </div>
</main>
