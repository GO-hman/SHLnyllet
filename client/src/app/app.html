<style>
  :host {
    display: block;
    height: 100dvh;
  }

  h1 {
    font-size: 3.125rem;
    color: var(--gray-900);
    font-weight: 500;
    line-height: 100%;
    letter-spacing: -0.125rem;
    margin: 0;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  p {
    margin: 0;
    color: var(--gray-700);
  }

  main {
    width: 100%;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    box-sizing: inherit;
    position: relative;
    background-color:  #76869e;
  }

  .content {
    display: flex;
    justify-content: space-around;
    width: 100%;
    max-width: 700px;
    margin-bottom: 3rem;
  }

  .content h1 {
    margin-top: 1.75rem;
  }

  .content p {
    margin-top: 1.5rem;
  }

  .player-picture{
    width: 480px;
    height: 640px;
    object-fit: cover;
  }
  
  input{
    background-color: #cec8c8;
  }
  button{
    background-color: #cec8c8;
  }

  @media screen and (max-width: 650px) {
    .content {
      flex-direction: column;
      width: max-content;
    }

    .divider {
      height: 1px;
      width: 100%;
      background: var(--red-to-pink-to-purple-horizontal-gradient);
      margin-block: 1.5rem;
    }
  }
</style>

<main class="main">
  <h1>Gissa nyllet!</h1>
  <div class="content">
   @if(loading()){
    <h2>Loading...</h2>
   }
   @if(currPlayer() != null){

     <img class="player-picture" [src]="currPlayer()?.imgUrl" alt="Bild på spelare"/>
    }
  </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column;">
      <label for="name">Namn:</label>
      <input name="name" type="text" formControlName="name"/>
      <button style="margin-top: 1rem;"type="submit">Gissa!</button>
    </form>
</main>
<router-outlet />
